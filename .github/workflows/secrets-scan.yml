# Reusable secret scan for every repo (design section 6). The every-repo
# baseline (docs/baseline.md) adds the caller. A public repo also turns on
# GitHub secret scanning and push protection in the repo settings.
#
# The trufflehog action scans the commits of the calling event: base to head
# on a pull request, before to after on a push. In a reusable workflow the
# github context belongs to the caller, so the action sees the caller's
# event.
name: secrets-scan

on:
  workflow_call:
    inputs:
      extra_args:
        description: "Extra trufflehog arguments. The default reports only secrets that trufflehog verified."
        type: string
        required: false
        default: "--only-verified"

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # trufflehog needs the base commit of the range in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: trufflehog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: ${{ inputs.extra_args }}
