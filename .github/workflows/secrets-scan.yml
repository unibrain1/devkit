# Reusable secret scan for private repos (design section 6). Public repos
# get GitHub secret scanning and push protection from the repo settings, so
# they do not call this workflow.
#
# The trufflehog action scans the commits of the calling event: base to head
# on a pull request, before to after on a push. In a reusable workflow the
# github context belongs to the caller, so the action sees the caller's
# event.
name: secrets-scan

on:
  workflow_call:
    inputs:
      extra_args:
        description: "Extra trufflehog arguments. The default reports only secrets that trufflehog verified."
        type: string
        required: false
        default: "--only-verified"

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # trufflehog needs the base commit of the range in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: trufflehog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: ${{ inputs.extra_args }}
