# Baseline Dependabot config from devkit (docs/baseline.md). It bumps the
# pinned actions one time each week, in one grouped PR. It does not bump
# the devkit callers: the devkit pin moves only by hand, at a milestone
# boundary (docs/ci-workflows.md, devkit pin rule).
# Each entry waits 7 days after a release (cooldown), so that a bad or
# compromised release can be found before Dependabot opens a PR for it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: unibrain1/devkit
  # Family A (docs/families.md): bump the npm packages one time each
  # week, in one grouped PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ["*"]
  # Bump the Composer packages one time each week, in one grouped PR.
  # If composer.json is in a subfolder, change the directory to that folder.
  # If the site has no composer.json, remove this entry.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      composer:
        patterns: ["*"]
