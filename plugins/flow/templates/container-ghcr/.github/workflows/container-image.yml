# Image CI from devkit (docs/families.md, Family B). container-image.yml
# lints the Dockerfile with hadolint and builds the image. A PR only builds
# the image. A push to main pushes the tags edge and sha-<7 hex>. A vX.Y.Z
# tag pushes X.Y.Z, X.Y, and latest. The job id gives the check names
# "image / Lint (Dockerfile)" and "image / Build". Edit a caller only at a
# milestone boundary (docs/design.html, section 8, "Rules that follow").
name: Container image
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
# One run goes at a time in each group. A newer pending run replaces an
# older pending run. All tag runs share the group "release", so two tags
# cannot race for latest. A new commit on a PR stops the old PR run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: unibrain1/devkit/.github/workflows/container-image.yml@main
    # Each input has a default. Set one only when the repo needs it:
    # with:
    #   image: ghcr.io/<owner>/<name>
    #   context: app
    #   dockerfile: app/Dockerfile
    #   platforms: linux/amd64
