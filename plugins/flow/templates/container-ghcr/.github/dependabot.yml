# Baseline Dependabot config from devkit (docs/baseline.md). It bumps the
# pinned actions one time each week, in one grouped PR. It does not bump
# the devkit callers: the devkit pin moves only by hand, at a milestone
# boundary (docs/ci-workflows.md, devkit pin rule).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: unibrain1/devkit
  # Family B (docs/families.md): bump the base images in the Dockerfile
  # one time each week, in one grouped PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker:
        patterns: ["*"]
  # The packages of the stack, one time each week, in one grouped PR.
  - package-ecosystem: "{{stack_ecosystem}}"
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      stack:
        patterns: ["*"]
