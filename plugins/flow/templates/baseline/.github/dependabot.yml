# Baseline Dependabot config from devkit (docs/baseline.md). It bumps the
# pinned actions one time each week, in one grouped PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
