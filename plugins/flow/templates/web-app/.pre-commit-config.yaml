# Baseline pre-commit hooks from devkit (docs/baseline.md). Each repo gets
# the same checks. Run `pre-commit install` one time in each clone to turn
# the hooks on.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  # test_quick slot. To turn it on, remove the first "# " mark from each
  # line from "- repo: local" to the stages line. Then replace the entry
  # with the test_quick command of this repo.
  # If test_quick takes more than about 20 seconds, move it to pre-push.
  # Remove the second "# " mark from the stages line too. Then run:
  # `pre-commit install --hook-type pre-push`.
  # - repo: local
  #   hooks:
  #     - id: test-quick
  #       name: test_quick
  #       entry: REPLACE-WITH-TEST-QUICK-COMMAND
  #       language: system
  #       pass_filenames: false
  #       # stages: [pre-push]
  # gitleaks scans only the staged files.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Family W (docs/families.md): the type check and the fast tests run at
  # each commit. The commented test_quick slot above is the baseline copy.
  # Do not turn it on: this block has the test-quick hook. If test_quick
  # takes more than about 20 seconds, add "stages: [pre-push]" to the
  # test-quick hook. Then run `pre-commit install --hook-type pre-push`.
  # Each hook runs its command through bash -c. pre-commit runs entry with
  # no shell, so "a && b" would run a with the words "&&" and "b".
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: bash
        args:
          - "-c"
          - "{{typecheck}}"
        language: system
        pass_filenames: false
      - id: test-quick
        name: test_quick
        entry: bash
        args:
          - "-c"
          - "{{test_quick}}"
        language: system
        pass_filenames: false
